[project]
name = "miramedia"
version = "1.0.15"
description = "Self-hosted media manager for movies and TV shows"
requires-python = ">=3.13"
dependencies = [
    "cachetools>=6.0.0",
    "fastapi[standard]>=0.115.12",
    "fastapi-users[sqlalchemy]>=15.0.2",
    "httpx>=0.28.1",
    "httpx-oauth>=0.16.1",
    "jsonschema>=4.24.0",
    "psycopg[binary,pool]>=3.2.9",
    "asyncpg>=0.30.0",
    "greenlet>=3.1.1",
    "pydantic>=2.11.5",
    "pydantic-settings[toml]>=2.14.2",
    "python-json-logger>=3.3.0",
    "qbittorrent-api>=2025.5.0",
    "requests>=2.32.3",
    "sqlalchemy>=2.0.41",
    "starlette>=0.49.1",
    "tmdbsimple>=2.9.1",
    "tvdb-v4-official>=1.1.0",
    "uvicorn>=0.34.2",
    "taskiq>=0.12.0",
    "taskiq-fastapi>=0.4.0",
    "taskiq-postgresql[psycopg]>=0.4.0",
    "alembic>=1.16.1",
    "pillow>=11.3.0",
    "sabnzbd-api>=0.1.2",
    "transmission-rpc>=7.0.11",
    "libtorrent>=2.0.11",
    "pathvalidate>=3.3.1",
    "asgi-correlation-id>=4.3.4",
    "beautifulsoup4>=4.12",
    "selectolax>=0.3.21",
    "nodriver>=0.38",
    "subliminal>=2.2",
    "babelfish>=0.6",
    # Upper bound: guessit 4.0 bumps rebulk to 6.x and forces a subliminal
    # *downgrade* (2.6 -> 2.2), dropping knowit/trakit and changing the parse
    # behaviour the import pipeline depends on. Lift after validating 4.x.
    "guessit>=3.8.0,<4",
    "pymediainfo>=7.0.1",
    "curl-cffi>=0.7",
    "cryptography>=44.0.0",
    "defusedxml>=0.7.1",
    "sse-starlette>=3.4.4",
    "prometheus-fastapi-instrumentator>=8.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff",
    "ty>=0.0.9",
]

[tool.setuptools.packages.find]
include = ["miramedia*"]
exclude = ["web*", "Writerside*", "metadata_relay*", "tests*"]

[tool.ruff]
# Vendored third-party subtitle plugins (LavX/bazarr-provider-catalog) are kept
# verbatim — don't lint/format them.
exclude = ["alembic/versions", "miramedia/subtitles/plugins/vendored"]
namespace-packages = ["alembic", "metadata_relay"]

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
# to be enabled: BLE, C90, CPY, D, DOC, DTZ, FBT, G, PL, RSE, SLF, SIM, TC
extend-select = [
    "A", "ARG", "ASYNC", "ANN",
    "B",
    "C4", "COM",
    "DTZ",
    "E", "EM", "EXE",
    "F", "FA", "FAST", "FIX", "FLY", "FURB",
    "I", "ICN", "INP", "INT", "ISC",
    "LOG",
    "N",
    "PERF", "PGH", "PIE", "PT", "PTH", "PYI",
    "Q",
    "RET", "RUF",
    "S", "SLOT",
    "T10", "T20", "TD", "TID", "TRY",
    "UP",
    "W",
    "YTT",
]

ignore = [
    # incompatible with formatter
    "COM812",
    # lines too long
    "E501",
    # currently a bug?! with providers and depends
    "FAST003",
    # I'm not sure if we want to lint them
    "FIX002",
    # let's decide if we want this
    "TD002", "TD003",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Path", "taskiq.TaskiqDepends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --ignore=tests/integration -m 'not postgresql'"
filterwarnings = [
    # Ratchet: new project-owned deprecations fail the suite.
    "error::DeprecationWarning:miramedia",
    "error::pydantic.warnings.PydanticDeprecatedSince211:miramedia",
    # Upstream (FastAPI/Starlette): TestClient still imports starlette.testclient + httpx.
    # Remove when tests migrate to httpx2 per StarletteDeprecationWarning guidance.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning:fastapi.testclient",
    # Upstream (PyJWT): auth cache tests use intentionally short HMAC secrets.
    # Remove when test fixtures use >=32-byte keys (RFC 7518 Section 3.2).
    "ignore:The HMAC key is .* bytes long, which is below the minimum recommended length:jwt.warnings.InsecureKeyLengthWarning:jwt.api_jwt",
    # Upstream (Starlette): OAuth callback tests pass per-request cookies to TestClient.
    # Remove when tests set cookies on the client instance instead.
    "ignore:Setting per-request cookies=.* is being deprecated:DeprecationWarning:starlette.testclient",
]
markers = [
    "integration: PostgreSQL integration tests (require MIRAMEDIA_TEST_DATABASE_URL)",
    "postgresql: tests that require MIRAMEDIA_TEST_DATABASE_URL disposable PostgreSQL",
]

[tool.ruff.lint.per-file-ignores]
"scripts/migration_head_audit.py" = ["INP001"]
"tests/integration/**" = ["S607", "TRY300"]
# Indexer sites and the generic metadata backend implement a shared abstract
# interface; some sites/backends legitimately ignore interface parameters
# (e.g. a movies-only site ignores season_number). The unused-argument is
# structural, not dead code.
"miramedia/indexers/sites/*.py" = ["ARG002"]
"miramedia/metadata/backends/generic.py" = ["ARG002"]
"tests/*" = ["S101", "S105", "S106", "S324", "ANN", "INP001", "D"]

# ---------------------------------------------------------------------------
# ty type-checker configuration
# ---------------------------------------------------------------------------

[tool.ty.rules]
# Project-wide design: update_* repository methods use `...` (EllipsisType) as
# a sentinel for "not provided" to distinguish from explicitly passing None.
# ty doesn't understand this pattern and flags every parameter with `... = ...`
# as invalid-parameter-default. Suppress globally — it's a documented convention.
invalid-parameter-default = "ignore"

# ---------------------------------------------------------------------------
# Per-file suppressions: third-party stub gaps and intentional dynamic patterns
# ---------------------------------------------------------------------------

# libtorrent ships as a C extension with no type stubs.  Every libtorrent.*
# attribute access is an unresolved-attribute false-positive.
# Also: NativeDownloadClient singleton __new__ emits call-non-callable once
# for the `cls._instance` path that ty can't narrow past None.
# apply_settings(dict) and torrent_info(bdecode(...)) are valid at runtime but
# stricter than the libtorrent stub overloads.
[[tool.ty.overrides]]
include = [
    "miramedia/torrents/backends/native.py",
    "miramedia/torrents/utils.py",
]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
call-non-callable = "ignore"
invalid-argument-type = "ignore"
no-matching-overload = "ignore"

# core/router.py: QueuePool.size/checkedout/overflow are real methods but the
# SQLAlchemy Pool stub lacks them; health-check connect() is guarded non-None
# at runtime; PIL Image.save(**params) stub is imprecise for keyword args.
[[tool.ty.overrides]]
include = ["miramedia/core/router.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"

# startup.py: anyio.to_thread.current_default_thread_limiter resolves against
# type[BrokenWorkerInterpreter] in the anyio stub — a false positive.
[[tool.ty.overrides]]
include = ["miramedia/startup.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

# SubtitleService holds ShowService/MovieService as `service: ShowService | None`
# module-level singletons initialised lazily at startup. ty sees `| None` on every
# attribute access even though the service is always initialised before any request
# reaches these call sites.
[[tool.ty.overrides]]
include = ["miramedia/subtitles/service.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

# nodriver browser automation is monkey-patched at runtime (patched_start,
# patched_connect, patched_request). ty correctly flags the assignments and
# argument mismatches — these are intentional bypass shims.
[[tool.ty.overrides]]
include = ["miramedia/cloudflare/bypass.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"

# subliminal's Provider.list_subtitles uses `Set[Language]` (typing.Set) in its
# stub while our providers override with `set[Language]` (builtin). ty treats the
# two as distinct and flags every override; they are identical at runtime in 3.13.
# vendored plugins may use older patterns (bytes+str regex, etc.).
[[tool.ty.overrides]]
include = ["miramedia/subtitles/**"]

[tool.ty.overrides.rules]
invalid-method-override = "ignore"
unsupported-operator = "ignore"

# TVMaze and Cinemeta JSON responses are typed as `dict | list` because the API
# can return either. Call sites use isinstance checks but ty can't always narrow
# through the union — unresolved-attribute / invalid-argument-type on the list
# variant and resolved_imdb | None narrowing are false-positives.
# Also: urllib3's allowed_gai_family is monkey-patched for IPv4-only requests.
[[tool.ty.overrides]]
include = [
    "miramedia/metadata/backends/native.py",
    "miramedia/metadata/backends/tvdb.py",
]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
invalid-assignment = "ignore"
invalid-argument-type = "ignore"
unsupported-operator = "ignore"
possibly-missing-submodule = "ignore"

# database/__init__.py uses string forward-references ("ShowService" etc.) for
# circular-import avoidance — the actual classes are imported inside function
# bodies, so ty sees unresolved-reference at module scope.
# Prometheus client counter/gauge .labels() and SQLAlchemy Pool.size/overflow/
# checkedout are runtime attributes not reflected in the installed stubs.
[[tool.ty.overrides]]
include = ["miramedia/database/__init__.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
unresolved-reference = "ignore"

# CachedStaticFiles forwards *args/**kwargs to StaticFiles.__init__ using
# `object` annotations — ty can't verify the kwarg types match the parent's
# typed signature. FastAPI/Starlette exception handler registration uses
# contravariant exception subclasses not captured by Starlette's stubs.
# SessionLocal/SessionLocalBackground are `async_sessionmaker | None` globals
# initialised in lifespan; ty flags them as non-callable at every use site.
# anyio BrokenWorkerInterpreter, SQLAlchemy Pool stats, AsyncEngine | None
# init-order are all stubs/flow-analysis gaps.
[[tool.ty.overrides]]
include = ["miramedia/main.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
call-non-callable = "ignore"
unresolved-attribute = "ignore"
possibly-missing-submodule = "ignore"

# Starlette add_exception_handler stubs require `Exception` but we register
# handlers for more specific exception subclasses.
[[tool.ty.overrides]]
include = ["miramedia/exceptions.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

# Module-level SessionLocal* globals (async_sessionmaker | None) initialised
# in lifespan; scheduler calls them before they are set per ty's flow analysis
# but the runtime init order ensures they are never None at call time.
[[tool.ty.overrides]]
include = ["miramedia/scheduler.py"]

[tool.ty.overrides.rules]
call-non-callable = "ignore"

# Same SessionLocal pattern in queue hooks and library watcher.
# imports/queue/sync.py: ty can't narrow TorrentImportItem | ScanImportItem
# via item.kind == "torrent" string literal discriminator — .entry only exists
# on TorrentImportItem, which is correct, but narrowing doesn't fire.
[[tool.ty.overrides]]
include = [
    "miramedia/imports/queue_hooks.py",
    "miramedia/library_watcher.py",
    "miramedia/imports/queue/sync.py",
]

[tool.ty.overrides.rules]
call-non-callable = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"

# SQLAlchemy CursorResult.rowcount exists at runtime but is not reflected in
# the installed stubs for Result[Any].  Affects every repository file that
# calls execute() and inspects rowcount.
[[tool.ty.overrides]]
include = [
    "miramedia/shows/repository.py",
    "miramedia/movies/repository.py",
    "miramedia/torrents/repository.py",
    "miramedia/torrents/service.py",
    "miramedia/scheduler.py",
    "miramedia/auth/router.py",
    "miramedia/imports/repository.py",
    "miramedia/requests/repository.py",
    "miramedia/notifications/repository.py",
    "miramedia/logs/repository.py",
    "miramedia/logs/handler.py",
]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

# SQLAlchemy Select is invariant in its type parameter but we pass concrete
# select(Show) / select(func.count()) to functions typed as Select[tuple[object,...]]
# which is the most general form.  The calls are safe; this is a stubs gap.
# Also: NewType IDs (ShowId, MovieId, TorrentId) wrap UUID but ty correctly
# rejects UUID→NewType at function boundaries — resolving requires a bulk
# casting refactor (owner decision).
[[tool.ty.overrides]]
include = [
    "miramedia/shows/service.py",
    "miramedia/shows/repository.py",
    "miramedia/movies/service.py",
    "miramedia/movies/repository.py",
    "miramedia/torrents/router.py",
    "miramedia/torrents/service.py",
    "miramedia/torrents/repository.py",
    "miramedia/imports/service.py",
    "miramedia/imports/repository.py",
    "miramedia/imports/scan.py",
    "miramedia/indexers/service.py",
    "miramedia/requests/sync.py",
    "miramedia/requests/repository.py",
    "miramedia/notifications/repository.py",
]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

# auth/users.py: SQLAlchemy mapped attribute accessed as str (UserModel.email.in_())
# ty sees the annotated type str, not the Column[str] descriptor with .in_().
# call-non-callable: SessionLocal init guard checked at startup.
[[tool.ty.overrides]]
include = ["miramedia/auth/users.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
call-non-callable = "ignore"
no-matching-overload = "ignore"

# auth/router.py: fastapi-users generic invariance (fastapi_users stubs use
# covariant type params that ty treats as invariant in the installed stubs).
[[tool.ty.overrides]]
include = ["miramedia/auth/router.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"

# requests/backends: SeerrClient / provider are optional singletons wired
# during startup; ty sees X | None at every call site.
[[tool.ty.overrides]]
include = ["miramedia/requests/backends/composite.py", "miramedia/requests/backends/seerr.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"

# metadata/dependencies.py: get_metadata_provider accepts a runtime str from
# DB rows but is typed as Literal["native","tmdb","tvdb"].
# call-non-callable: lazy ShowService/MovieService globals.
[[tool.ty.overrides]]
include = ["miramedia/metadata/dependencies.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
call-non-callable = "ignore"
unresolved-attribute = "ignore"

# Torznab XML parsing calls item.find().text / .attrib without None checks.
# The whole loop is wrapped in except Exception so a None dereference is
# caught and logged — these are latent bugs but fixing them needs logic
# changes beyond annotation fixes. Suppress + flag for owner.
# Also: unknown-argument from jackett/prowlarr subclass __init__.
[[tool.ty.overrides]]
include = ["miramedia/indexers/backends/torznab_mixin.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
unknown-argument = "ignore"

# indexers/backends: jackett/prowlarr/native/generic share same pattern.
[[tool.ty.overrides]]
include = [
    "miramedia/indexers/backends/jackett.py",
    "miramedia/indexers/backends/prowlarr.py",
    "miramedia/indexers/backends/native.py",
    "miramedia/indexers/backends/generic.py",
    "miramedia/indexers/backends/torznab_mixin.py",
    "miramedia/indexers/sites/base.py",
    "miramedia/indexers/sites/yts.py",
    "miramedia/indexers/sites/eztv.py",
    "miramedia/indexers/service.py",
    "miramedia/indexers/utils.py",
]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
unsupported-operator = "ignore"

# qbittorrent backend: torrent_info dict contains dynamic JSON values;
# ty can't narrow the value types from .get() calls.
# invalid-assignment: monkey-patched connection methods.
[[tool.ty.overrides]]
include = ["miramedia/torrents/backends/qbittorrent.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
unresolved-attribute = "ignore"
unsupported-operator = "ignore"

# subliminal provider stubs: various invalid-argument-type from vendored/external
# provider code that uses older subliminal APIs.
[[tool.ty.overrides]]
include = [
    "miramedia/subtitles/providers/yifysubtitles.py",
    "miramedia/subtitles/providers/subdl.py",
    "miramedia/subtitles/providers/subsource.py",
    "miramedia/subtitles/plugins/vendored/isubtitles.py",
    "miramedia/subtitles/plugins/vendored/my_subs.py",
    "miramedia/subtitles/plugins/vendored/tvsubtitles.py",
    "miramedia/subtitles/plugins/vendored/embeddedsubtitles.py",
    "miramedia/subtitles/plugins/adapter.py",
]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
unresolved-attribute = "ignore"
no-matching-overload = "ignore"

# exceptions.py: Starlette add_exception_handler stubs require exact Exception
# type; our handlers take subclasses (contravariance gap in stubs).
[[tool.ty.overrides]]
include = ["miramedia/exceptions.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

# config.py: MiraMediaConfig.libraries not yet added to the model but referenced
# in library scan code — owner TODO.
# metadata/config.py: no-matching-overload from pydantic validator overloads.
[[tool.ty.overrides]]
include = ["miramedia/config.py", "miramedia/metadata/config.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
no-matching-overload = "ignore"
invalid-argument-type = "ignore"

# torrents/service.py, imports/followup.py: match().group() called after None
# check that ty can't thread through; Torrent.files stub gap.
[[tool.ty.overrides]]
include = [
    "miramedia/torrents/service.py",
    "miramedia/torrents/backends/transmission.py",
    "miramedia/imports/followup.py",
    "miramedia/imports/service.py",
    "miramedia/imports/scan.py",
    "miramedia/logs/handler.py",
    "miramedia/notifications/service_providers/ntfy.py",
    "miramedia/requests/sync.py",
    "miramedia/requests/backends/seerr.py",
]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
unsupported-operator = "ignore"

# events/bus.py: Queue[Event] | None guard acknowledged with type: ignore[union-attr]
# (mypy-style comment — doesn't suppress ty).
[[tool.ty.overrides]]
include = ["miramedia/events/bus.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

# subtitles/plugins/adapter.py: hub_class is `type | None` (nullable class ref),
# guarded by initialisation — ty can't prove non-None at instantiation.
# subtitles/service.py: video.series_imdb_id protocol assignment narrowing gap.
[[tool.ty.overrides]]
include = [
    "miramedia/subtitles/plugins/adapter.py",
    "miramedia/subtitles/service.py",
]

[tool.ty.overrides.rules]
call-non-callable = "ignore"
invalid-assignment = "ignore"
unresolved-attribute = "ignore"
unsupported-operator = "ignore"

# metadata/utils.py: fn.__name__ — ty says not all callables have __name__
# but `reraise_provider_unreachable` decorates plain functions only.
# movies/router.py: hasattr guard means enrich_movie_result is intentionally
# dynamic; metadata_provider typed as object by dependency injection.
[[tool.ty.overrides]]
include = ["miramedia/metadata/utils.py", "miramedia/movies/router.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
call-non-callable = "ignore"

# cloudflare/session.py: super().request(*args, **kwargs) forwarding to
# curl_cffi; stub gap for Session.request signature.
[[tool.ty.overrides]]
include = ["miramedia/cloudflare/session.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

# updates/service.py: compare_semver tuple access returns int | str; ty
# can't narrow by index variable so `pa[i] > pb[i]` flags as unsupported.
# The parsed tuple is always (int, int, int, str) — index 0-2 are ints.
[[tool.ty.overrides]]
include = ["miramedia/updates/service.py"]

[tool.ty.overrides.rules]
unsupported-operator = "ignore"

# imports/tasks.py: run_post_import_completion called with named args that
# include an untyped `db` parameter (noqa ANN001 in followup.py).
[[tool.ty.overrides]]
include = ["miramedia/imports/tasks.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

# indexers/service.py: on_site_result kwarg is passed speculatively and the
# TypeError fallback handles the no-op case (duck-typing pattern).
# indexers/sites/torznab_site.py: **kwargs forwarded to BaseSite.__init__.
[[tool.ty.overrides]]
include = [
    "miramedia/indexers/service.py",
    "miramedia/indexers/sites/torznab_site.py",
]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
unknown-argument = "ignore"
no-matching-overload = "ignore"

# scheduler.py: metadata_provider_name is a plain str from the DB but
# get_metadata_provider is typed for Literal["native","tmdb","tvdb"].
# movies/repository.py: setdefault with non-None default not in stdlib stubs.
[[tool.ty.overrides]]
include = ["miramedia/scheduler.py", "miramedia/movies/repository.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
no-matching-overload = "ignore"
