name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # libtorrent ships cp313 wheels only; keep CI off newer interpreters
      # until the wheel gap closes.
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Sync dependencies (frozen)
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Type check (ty)
        run: uv run ty check miramedia
      - name: Tests
        run: uv run pytest
        env:
          MIRAMEDIA_LOG_FILE: /dev/null

  postgres-integration:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
      MIRAMEDIA_TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/miramedia_integration_test
      MIRAMEDIA_LOG_FILE: /dev/null
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: miramedia_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d miramedia_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Sync dependencies (frozen)
        run: uv sync --frozen
      - name: Migration head audit
        run: uv run python scripts/migration_head_audit.py
      - name: Alembic upgrade head (clean database)
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/miramedia_integration_test
      - name: Verify database revision matches repository head
        run: uv run python scripts/migration_head_audit.py --verify-db
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/miramedia_integration_test
      - name: PostgreSQL integration tests
        run: |
          uv run pytest -m integration tests/integration
          uv run pytest -m postgresql tests/

  types-drift:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            types-drift:
              - 'miramedia/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'web/src/lib/api/**'
              - 'web/public/openapi.json'
              - 'web/package.json'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: steps.filter.outputs.types-drift == 'true'
        with:
          enable-cache: true
      - name: Sync dependencies (frozen)
        if: steps.filter.outputs.types-drift == 'true'
        run: uv sync --frozen
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        if: steps.filter.outputs.types-drift == 'true'
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.filter.outputs.types-drift == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web deps (frozen lockfile)
        if: steps.filter.outputs.types-drift == 'true'
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Regenerate OpenAPI spec + client types
        if: steps.filter.outputs.types-drift == 'true'
        run: make openapi
      - name: Fail on drift
        if: steps.filter.outputs.types-drift == 'true'
        run: |
          git diff --exit-code web/public/openapi.json web/src/lib/api/api.d.ts \
            || { echo "::error::OpenAPI artifacts stale — run 'make openapi' and commit."; exit 1; }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        # version intentionally omitted: pnpm/action-setup reads the
        # "packageManager" field from web/package.json (pnpm@10.30.3)
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # Generate ONCE for the whole job: the collections (`web/.source`) + Next
      # type declarations are build prerequisites, and the self-contained
      # `typecheck` / `build` scripts would each run fumadocs-mdx again. Every
      # gate below therefore uses the `:generated` variant — exactly one MDX run
      # per job. Developer/Docker/docs paths keep the self-contained scripts.
      - name: Generate types (fumadocs source + next typegen)
        run: pnpm run generate
      - name: Test
        run: pnpm test
      - name: Lint
        run: pnpm run lint
      - name: Format check
        run: pnpm run format:check
      - name: Typecheck
        run: pnpm run typecheck:generated
      - name: Build
        run: pnpm run build:generated

  # Chromium smoke suite for the critical media mutation workflows (manual
  # torrent add + import recovery). No backend/DB: every /api/** request is
  # intercepted inside the specs. Separate job so a browser flake never blocks
  # the fast unit/lint/type gates above.
  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # Playwright's own dev server (`next dev`) needs the generated fumadocs
      # source + Next type declarations present up front (see web/CLAUDE.md).
      - name: Generate types (fumadocs source + next typegen)
        run: pnpm run generate
      - name: Install Chromium runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser smoke tests
        run: pnpm run test:e2e

  # Real full-stack smoke: Chromium → static export served by FastAPI → Postgres.
  # Self-sufficient: builds the frontend in-job (`pnpm build` generates Fumadocs
  # MDX itself — never prepend `pnpm run generate` here; see CLAUDE.md).
  frontend-smoke-real:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
      MIRAMEDIA_TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/miramedia_integration_test
      MIRAMEDIA_LOG_FILE: /dev/null
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: miramedia_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d miramedia_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Sync dependencies (frozen)
        run: uv sync --frozen
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web deps (frozen lockfile)
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Build static export (self-sufficient — generates MDX itself)
        run: pnpm build
        working-directory: web
      - name: Install Chromium runtime
        run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - name: Real frontend smoke test
        run: pnpm run test:smoke
        working-directory: web
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@bda57500c8ffc6570d5530b025ebbf9982fb4a4d # v5.0.0
        with:
          name: frontend-smoke-real
          path: |
            web/test-results-smoke/
            web/playwright-report/
          if-no-files-found: ignore

  # Regenerate the OpenAPI spec + client types on main and open a PR if they drift,
  # so the Pages docs site (which renders the committed web/public/openapi.json) is
  # never stale — no manual `make openapi` needed. Runs only on direct pushes to main
  # (fork PRs can't be pushed to; the PR-only drift checks above gate those).
  #
  # This deliberately does NOT push to main: main stays authored by humans. The job
  # force-pushes a fixed branch and reuses the open PR, so repeated drift updates one
  # PR instead of stacking new ones. Merging it is what makes the Docs workflow
  # redeploy with the fresh spec.
  openapi-sync:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Sync dependencies (frozen)
        run: uv sync --frozen
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web deps (frozen lockfile)
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Regenerate OpenAPI spec + client types
        run: make openapi
      - name: Open sync PR if changed
        # checkout@v7 persists the GITHUB_TOKEN credentials, so a plain push works.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/openapi-sync
        run: |
          if git diff --quiet -- web/public/openapi.json web/src/lib/api/api.d.ts; then
            echo "OpenAPI spec + types already in sync — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add web/public/openapi.json web/src/lib/api/api.d.ts
          git commit -m "Sync OpenAPI spec + client types"
          # Force-push: the branch is a disposable snapshot of the latest main + regen.
          git push --force origin "$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "Existing sync PR updated."
          else
            gh pr create \
              --head "$BRANCH" \
              --base main \
              --title "Sync OpenAPI spec + client types" \
              --body "\`make openapi\` output drifted from the committed files on main.

          Regenerated \`web/public/openapi.json\` and \`web/src/lib/api/api.d.ts\`. Merging this
          keeps the Pages docs site in sync with the live API schema.

          Opened automatically by the \`openapi-sync\` job in \`.github/workflows/ci.yml\`."
          fi

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build image (amd64, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          target: app
          push: false
          build-args: |
            VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-audit:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: pip-audit
        run: |
          uv export --locked --no-dev --format requirements-txt > /tmp/req.txt
          uvx pip-audit --strict -r /tmp/req.txt --disable-pip
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web deps (frozen lockfile)
        run: pnpm install --frozen-lockfile
        working-directory: web
      # Dev-tooling advisories (openapi-typescript, shadcn) remain; visibility only.
      - name: pnpm audit
        continue-on-error: true
        run: pnpm audit --audit-level high
        working-directory: web
