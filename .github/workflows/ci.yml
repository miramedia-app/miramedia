name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # libtorrent ships cp313 wheels only; keep CI off newer interpreters
      # until the wheel gap closes.
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Sync dependencies (frozen)
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Type check (ty)
        run: uv run ty check miramedia
      - name: Tests
        run: uv run pytest
        env:
          MIRAMEDIA_LOG_FILE: /dev/null

  postgres-integration:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
      MIRAMEDIA_TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/miramedia_integration_test
      MIRAMEDIA_LOG_FILE: /dev/null
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: miramedia_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d miramedia_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Sync dependencies (frozen)
        run: uv sync --frozen
      - name: Migration head audit
        run: uv run python scripts/migration_head_audit.py
      - name: Alembic upgrade head (clean database)
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/miramedia_integration_test
      - name: Verify database revision matches repository head
        run: uv run python scripts/migration_head_audit.py --verify-db
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/miramedia_integration_test
      - name: PostgreSQL integration tests
        run: |
          uv run pytest -m integration tests/integration
          uv run pytest -m postgresql tests/

  types-drift:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Sync dependencies (frozen)
        run: uv sync --frozen
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web deps (frozen lockfile)
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Regenerate OpenAPI spec + client types
        run: make openapi
      - name: Fail on drift
        run: |
          git diff --exit-code web/public/openapi.json web/src/lib/api/api.d.ts \
            || { echo "::error::OpenAPI artifacts stale — run 'make openapi' and commit."; exit 1; }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        # version intentionally omitted: pnpm/action-setup reads the
        # "packageManager" field from web/package.json (pnpm@10.30.3)
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # Generate ONCE for the whole job: the collections (`web/.source`) + Next
      # type declarations are build prerequisites, and the self-contained
      # `typecheck` / `build` scripts would each run fumadocs-mdx again. Every
      # gate below therefore uses the `:generated` variant — exactly one MDX run
      # per job. Developer/Docker/docs paths keep the self-contained scripts.
      - name: Generate types (fumadocs source + next typegen)
        run: pnpm run generate
      - name: Test
        run: pnpm test
      - name: Lint
        run: pnpm run lint
      - name: Format check
        run: pnpm run format:check
      - name: Typecheck
        run: pnpm run typecheck:generated
      - name: Build
        run: pnpm run build:generated

  # Regenerate the OpenAPI spec + client types on main and commit them if they
  # drift, so the Pages docs site (which renders the committed web/public/openapi.json)
  # is never stale — no manual `make openapi` needed. Runs only on direct pushes to
  # main (fork PRs can't be pushed to; the PR-only drift checks above gate those).
  # The commit re-triggers this workflow, but the regen is idempotent: the second
  # run finds no diff, commits nothing, and stops — no loop. That web/** commit is
  # what makes the Docs workflow redeploy with the fresh spec.
  openapi-sync:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Sync dependencies (frozen)
        run: uv sync --frozen
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web deps (frozen lockfile)
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Regenerate OpenAPI spec + client types
        run: make openapi
      - name: Commit if changed
        # checkout@v6 persists the GITHUB_TOKEN credentials, so a plain push works.
        run: |
          if git diff --quiet -- web/public/openapi.json web/src/lib/api/api.d.ts; then
            echo "OpenAPI spec + types already in sync — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/openapi.json web/src/lib/api/api.d.ts
          git commit -m "Sync OpenAPI spec + client types"
          git push

  security-audit:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: pip-audit
        run: |
          uv export --locked --no-dev --format requirements-txt > /tmp/req.txt
          uvx pip-audit --strict -r /tmp/req.txt --disable-pip
